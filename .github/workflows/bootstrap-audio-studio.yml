name: Install Audio Studio 3.0 sources

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/bootstrap-audio-studio.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install exact source snapshot
        shell: pwsh
        run: |
          $archiveBase64 = @"
          
"@
          $zipPath = Join-Path $env:RUNNER_TEMP 'audio-studio-v3.0.0.zip'
          [IO.File]::WriteAllBytes($zipPath, [Convert]::FromBase64String(($archiveBase64 -replace '\s', '')))
          Expand-Archive -LiteralPath $zipPath -DestinationPath . -Force
          Remove-Item -LiteralPath '.github/workflows/bootstrap-audio-studio.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Audio Studio recording and enhancement features'
          git push
